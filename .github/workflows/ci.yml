name: ci

# Trunk branches: main plus integration/* (long-running reconciliation
# trunks, e.g. integration/viewer). PRs targeting either get the same
# gate — build, lint, strict typecheck (ADR 2026-06-09 §8) — and pushes
# (i.e. merged PRs) re-validate the branch itself.
on:
  pull_request:
    branches: [main, 'integration/**']
  push:
    branches: [main, 'integration/**']

# Cancel superseded runs on the same ref (saves minutes when pushes land
# quickly during a review round).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (no submodules — _ingest/ not needed for CI)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node 20.10
        uses: actions/setup-node@v4
        with:
          node-version: '20.10'

      - name: Enable corepack + activate pnpm@9.15.0
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      # Workspace install from repo root. pnpm-workspace.yaml lists
      # shell/, core/node_sdk_ts/, and nodes/*; one install wires
      # symlinks for all three packages.
      - name: workspace — install
        run: pnpm install --frozen-lockfile

      # Build every workspace package in topological order. SDK-shape
      # packages publish types via dist/; their consumers can't
      # typecheck against the workspace alias until dist exists.
      # Running `pnpm -r build` here auto-discovers new SDK-shape
      # packages without further workflow edits, and also covers the
      # full shell electron-vite build (main / preload / renderer)
      # which proves the workspace deps wire correctly end-to-end.
      # Enacts the 2026-05-20 ADR.
      - name: workspace — build all
        run: pnpm -r build

      - name: workspace — typecheck
        run: pnpm -r typecheck

      - name: workspace — lint
        run: pnpm -r lint

      # The SDK's round-trip vitest spawns Python Core. CI installs the
      # three Core deps; the test self-skips if any are missing, but on
      # the runner we want it to actually run.
      - name: core — install Python deps for round-trip test
        run: python3 -m pip install --quiet aiohttp pyyaml jsonschema

      - name: core/node_sdk_ts — round-trip test
        run: pnpm --filter @aether/mesh-node-sdk test
