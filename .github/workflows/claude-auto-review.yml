name: Claude Auto Review

# Same trunk-branch set as ci.yml: every PR that can reach a trunk
# branch (main or an integration/* reconciliation trunk) gets the
# mechanical review pass.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, 'integration/**']

jobs:
  auto-review:
    # Trunk-repo branches only (ADR 2026-06-09 §9, the #204 fork-PR gap):
    # on fork-originated PRs the action cannot obtain an OIDC token
    # (ACTIONS_ID_TOKEN_REQUEST_URL unavailable) and 401s before doing any
    # work. Collaborators push branches to this repo instead; skipping the
    # job here turns a confusing red 401 into an explicit policy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-5-20250929
          direct_prompt: |
            You are running mechanical, low-judgment review checks on this PR. Do not
            re-architect. Do not propose alternative implementations. Do not score
            quality. The Architect (a separate session) does the substantive review.
            Your job is to catch the five concrete failure modes listed below so the
            Architect's review round-trip is cheaper.

            Output a single PR comment with this exact shape, one section per check,
            using ✓ (pass), ⚠ (concern — describe specifically), or ⊘ (not applicable
            for this PR — say why in one short clause). Each ⚠ gets one line per
            issue, file-path-anchored where possible. No preamble, no closing summary.

            ## Auto-review (mechanical checks)

            **1. §7 self-review template completeness.** Verify the PR description
            contains all eight headings from CLAUDE.md §7: `## What changed`,
            `## Why`, `## How (high level)`, `## Risks / TODOs / Skipped`,
            `## Out-of-scope work explicitly avoided`, `## Pre-PR heuristics`,
            `## Verification`, `## Open questions for Architect`. A heading present
            with empty body counts as missing — flag it. The "Pre-PR heuristics"
            section must reference §11 explicitly (it's the prompt the heuristics
            check is for).

            **2. Changelog fragment present (#222).** Lanes never edit CHANGELOG.md;
            each lane adds ONE fragment at `changelog/unreleased/<issue>-<slug>.md`
            whose body is a `### Added|Changed|Fixed|Removed` heading plus the entry
            bullet (format: changelog/README.md). Verify the PR adds at least one
            such fragment. Flag (a) a PR that changes source, configs, or docs with
            no fragment, and (b) any hand-edit to CHANGELOG.md's `[Unreleased]`
            body, which is a generated stub. Exempt from (b): a release/roll PR —
            recognizable because it deletes fragments and adds a `## [x.y.z]`
            section via scripts/roll-changelog.mjs. Pre-1.0 versioning per
            CLAUDE.md §6 — do not enforce semver here.

            **3. ADR file format (#222).** ADRs live one per file at
            `decisions/<date>-<slug>.md`, opening with `## [YYYY-MM-DD] <Title>`.
            If the PR adds an ADR file, verify it has all six required fields, in
            this order: `**Status:**`, `**Decided by:**`, `**Context:**`,
            `**Decision:**`, `**Consequences:**`, `**Alternatives considered:**`.
            A missing or out-of-order field is a ⚠, as is an ADR added anywhere
            other than decisions/ (e.g. appended to DECISIONS.md). An edit to an
            EXISTING decisions/ file is a ⚠ unless it only flips `Status:` to
            `superseded by [link]` (the one permitted edit). DECISIONS.md is a
            generated index: flag any change to it that is not accompanied by a
            decisions/ change (regenerated via scripts/gen-decisions-index.mjs —
            CI checks staleness, you check provenance). Migrated pre-#222 files
            are policy-preserved verbatim — do not enforce field shape on files
            that already existed on `main`. If the PR touches neither decisions/
            nor DECISIONS.md, mark this ⊘.

            **4. Cross-doc consistency (CLAUDE.md §11.9).** When the PR's diff
            includes a literal phrase, version number ("Current state (v0.x.0)"),
            package name (`@homeos/*`, `@aether/*`), bundle identifier
            (`com.aether.app`), env var (`AETHER_DATA_DIR`, `HOMEOS_DATA_DIR`),
            preload-bridge global (`window.aether`, `window.homeOS`), Node version
            requirement, or quickstart command (`git clone`, `cd <dir>`) that
            appears in more than one of CLAUDE.md / MASTER_SYNTHESIS.md /
            DECISIONS.md / CHANGELOG.md / README.md / docs/*.md, grep all of them
            for the phrase and flag any divergence — UNLESS the divergence is in
            DECISIONS.md or CHANGELOG.md entries dated before the change (those are
            policy-preserved verbatim, ⊘ them with a note). One line per divergence,
            with the literal mismatched strings and the file paths.

            **5. Stealth-residual class (CLAUDE.md §10 identity-rename + workflow
            YAML gotchas).** If this PR is an identity rename or touches workspace
            scope / package names / bundle identifiers, verify the following
            surfaces are also updated coherently: every `.github/workflows/*.yml`
            (job names, `pnpm --filter <scope>` invocations, status-check names),
            `package.json` `name:` fields across all workspaces, `pnpm-workspace.yaml`,
            electron-builder `productName` + `appId`, preload bridge globals,
            README badge URLs (image + link), README quickstart `git clone` and
            `cd` commands, `.env.example`. A `pnpm --filter @<scope>/*` step that
            matches zero packages is a ⚠ (CLAUDE.md §10 — `pnpm --filter` silently
            exits 0 on zero-match). If the PR is not a rename and does not touch
            identity surfaces, mark this ⊘.

            ---

            Closing note: keep the comment terse. Each ⚠ is one line. Each ⊘
            includes one short clause on why it does not apply. Do not invent
            checks beyond the five above. Do not gate the merge — your output is
            advisory; the Architect and Director make the merge decision.
