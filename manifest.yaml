# Aether mesh manifest.
#
# Loaded by `python3 -m core.core --manifest manifest.yaml` (run from the
# vendored `core/` directory by the shell's coreManager). Format and
# semantics are defined in `_ingest/RAVEN_MESH/docs/SPEC.md` §8.
#
# Authorization is graph-membership: an edge present below means the
# relationship is permitted; absent means denied. There is no policy field.
# To grant a new capability, add a relationship line.
#
# Identity secrets are NEVER literal in this file — they reference env vars
# that the shell populates at boot. See core/README.md for the env-var
# contract. Manifest validator warns (not errors) on unset env vars; Core
# autogenerates a fallback secret in that case, which is fine for tests but
# not what we want in dev.

nodes:
  - id: shell
    runtime: local-process
    identity_secret: env:MESH_SHELL_SECRET
    metadata:
      description: |
        Aether Electron main process. Acts as a mesh client only — the shell
        does not yet expose any inbound surfaces. Surfaces will be added as
        renderer-facing capabilities (e.g. shell.toast, shell.focus_app)
        become useful for other nodes to invoke.
    surfaces: []

  - id: host_notifications
    runtime: local-process
    identity_secret: env:MESH_HOST_NOTIFICATIONS_SECRET
    metadata:
      description: |
        macOS native notification node. Fires `osascript -e 'display
        notification ...'` per invocation. macOS only in v0.1.0 — calls
        from any platform other than darwin return a MeshDeny.
    surfaces:
      - name: notify
        type: tool
        invocation_mode: request_response
        schema: nodes/host_notifications/schemas/notify.json

  - id: raven
    runtime: local-process
    identity_secret: env:MESH_RAVEN_SECRET
    metadata:
      description: |
        Voice assistant daemon (Gemini Live). Outbound-only mesh client —
        registers with Core so its signed envelopes are recognised, but
        exposes no inbound surfaces. Voice tools that touch Aether data
        or capabilities (e.g. notify) route through mesh.invoke instead
        of living in raven's internal Python tool registry.
    surfaces: []

  - id: news_feeds
    runtime: local-process
    identity_secret: env:MESH_NEWS_FEEDS_SECRET
    metadata:
      description: |
        RSS/Atom news aggregator. Polls a hardcoded list of feeds every
        15 minutes, dedupes by stable id, and exposes recent articles
        ordered by published_at desc. Local SQLite storage at
        $AETHER_DATA_DIR/news_feeds/news.db. First real *data* node on
        the Aether mesh (host_notifications was the first action node).
    surfaces:
      - name: recent
        type: tool
        invocation_mode: request_response
        schema: nodes/news_feeds/schemas/recent.json
      - name: search
        type: tool
        invocation_mode: request_response
        schema: nodes/news_feeds/schemas/search.json
      - name: breaking
        type: tool
        invocation_mode: request_response
        schema: nodes/news_feeds/schemas/breaking.json
      - name: search_by_entity
        type: tool
        invocation_mode: request_response
        schema: nodes/news_feeds/schemas/search_by_entity.json

  - id: finance
    runtime: local-process
    identity_secret: env:MESH_FINANCE_SECRET
    metadata:
      description: |
        Stock-quote aggregator. Polls Yahoo Finance every 5 minutes for
        a hardcoded list of US tickers (one symbol every 30s within a
        cycle), with a Stooq CSV fallback when Yahoo flakes. No API
        key — both providers are anonymous. Current-quote cache stays
        in-memory — NOT SQLite, see DECISIONS.md "Second data node:
        finance". Each poll ALSO appends a row to a SEPARATE 90-day
        SQLite time series (history.db) backing the `history` surface;
        the two stores are split deliberately — current-quote
        in-memory so stale-after-restart can't mislead, historical
        on-disk so the time series accumulates. See DECISIONS.md
        "Finance historical quotes via passive accumulation". Exposes
        per-symbol `quote`, full-grid `market_summary`, and
        accumulated `history`. Second real *data* node — proves the
        template established by news_feeds carries to API-shaped
        sources, not just RSS. Extended in Sprint 2 with `movers`
        (top gainers/losers), `sectors` (SPDR sector ETF performance),
        `earnings` (upcoming earnings calendar, not-implemented stub),
        and `market_overview` (broad market snapshot).
    surfaces:
      - name: quote
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/quote.json
      - name: market_summary
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/market_summary.json
      - name: history
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/history.json
      - name: movers
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/movers.json
      - name: sectors
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/sectors.json
      - name: earnings
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/earnings.json
      - name: market_overview
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/market_overview.json

  - id: weather
    runtime: local-process
    identity_secret: env:MESH_WEATHER_SECRET
    metadata:
      description: |
        Weather node. Polls Open-Meteo every 15 minutes for current
        conditions and 7-day forecast. No API key — Open-Meteo public
        tier. Requires AETHER_WEATHER_LAT/LON/LABEL env vars; starts
        in graceful-degradation mode if unset (available: false on all
        surfaces). In-memory cache only — no DB. Current + forecast
        surfaces exposed. Third data node — proves the template works
        for no-auth external APIs, not just Yahoo/Stooq (finance) or
        RSS (news).
    surfaces:
      - name: current
        type: tool
        invocation_mode: request_response
        schema: nodes/weather/schemas/current.json
      - name: forecast
        type: tool
        invocation_mode: request_response
        schema: nodes/weather/schemas/forecast.json

  - id: digest
    runtime: local-process
    identity_secret: env:MESH_DIGEST_SECRET
    metadata:
      description: |
        Briefing composer. First multi-hop mesh node on Aether: fans
        out to news_feeds + finance + weather on each invocation and
        synthesizes a morning or evening briefing. Two surfaces:
        morning() (top news + market snapshot + weather) and evening()
        (top news + market close + day's SPY range + weather).
        Upstream failures degrade gracefully — each section either has
        content or carries a brief "data unavailable" note; the
        briefing never fails as a whole because one upstream returned
        an error. Optional opt-in scheduler (DIGEST_SCHEDULED=true)
        fires morning + evening briefings on local-time hour
        boundaries via host_notifications.notify. Default off.
    surfaces:
      - name: morning
        type: tool
        invocation_mode: request_response
        schema: nodes/digest/schemas/morning.json
      - name: evening
        type: tool
        invocation_mode: request_response
        schema: nodes/digest/schemas/evening.json

  - id: vision
    runtime: local-process
    identity_secret: env:MESH_VISION_SECRET
    metadata:
      description: |
        Vision capture node. Real-time camera frame access via
        AVFoundation on macOS. Piece 1 of the vision arc (see
        MASTER_SYNTHESIS.md §11.6). Implements 10fps capture with
        5-second idle timeout for battery efficiency. Future surfaces
        (pieces 2/3/4): vision.gestures() for hand gesture
        recognition via MediaPipe, vision.pointing_target() to map
        index finger pointing to on-screen UI elements. macOS only in
        v0.1.x — no AVFoundation equivalent on other platforms yet.
    surfaces:
      - name: frame
        type: tool
        invocation_mode: request_response
        schema: nodes/vision/schema/frame_response.json

  - id: calendar
    runtime: local-process
    identity_secret: env:MESH_CALENDAR_SECRET
    metadata:
      description: |
        macOS Calendar.app integration via EventKit. Reads events
        from the user's Calendar.app — all calendars visible to the
        app (Personal, Work, subscribed, etc.). On first invocation
        macOS prompts the user for Calendar access permission; if
        denied, all three surfaces return {available: false, reason:
        'permission_denied'}. Three surfaces: calendar.today (all
        events on today's date, midnight to midnight),
        calendar.upcoming (next N events from now, default 5, max
        20), calendar.next_event (single next upcoming event). macOS
        only — EventKit is macOS-specific. Sprint 2 data-breadth
        lane.
    surfaces:
      - name: today
        type: tool
        invocation_mode: request_response
        schema: nodes/calendar/schemas/today.json
      - name: upcoming
        type: tool
        invocation_mode: request_response
        schema: nodes/calendar/schemas/upcoming.json
      - name: next_event
        type: tool
        invocation_mode: request_response
        schema: nodes/calendar/schemas/next_event.json

  - id: reminders
    runtime: local-process
    identity_secret: env:MESH_REMINDERS_SECRET
    metadata:
      description: |
        macOS Reminders.app mesh node. Reads from Reminders.app via
        pyobjc + EventKit. Three surfaces: reminders.due_today,
        reminders.overdue, reminders.upcoming. Read-only in v1.
        Permission prompt fires on first daemon spawn; daemon stays
        alive returning permission_denied until user grants access.
    surfaces:
      - name: due_today
        type: tool
        invocation_mode: request_response
        schema: nodes/reminders/schemas/due_today.json
      - name: overdue
        type: tool
        invocation_mode: request_response
        schema: nodes/reminders/schemas/overdue.json
      - name: upcoming
        type: tool
        invocation_mode: request_response
        schema: nodes/reminders/schemas/upcoming.json
  - id: system_info
    runtime: local-process
    identity_secret: env:MESH_SYSTEM_INFO_SECRET
    metadata:
      description: |
        macOS system context node. Surfaces battery state, disk usage,
        network/WiFi status, and active application via native shell
        commands (pmset, df, networksetup, osascript). No API keys, no
        OAuth — just shell access. Readings cached 5-15s in-memory.
        TypeScript node spawned by nodeManager.
    surfaces:
      - name: battery
        type: tool
        invocation_mode: request_response
        schema: nodes/system_info/schemas/battery.json
      - name: disk
        type: tool
        invocation_mode: request_response
        schema: nodes/system_info/schemas/disk.json
      - name: network
        type: tool
        invocation_mode: request_response
        schema: nodes/system_info/schemas/network.json
      - name: active_app
        type: tool
        invocation_mode: request_response
        schema: nodes/system_info/schemas/active_app.json


relationships:
  # The shell's renderer can fire native notifications via mesh.invoke().
  - from: shell
    to: host_notifications.notify

  # Voice tools dispatch desktop notifications via the host_notifications
  # node. Added when raven was rebased onto the mesh (v0.2.1).
  - from: raven
    to: host_notifications.notify

  # The News app (renderer-side) reads recent headlines through the mesh.
  # No more hardcoded articles list in shell/src/apps/news/.
  - from: shell
    to: news_feeds.recent

  # Voice tool news_recent: "what's in the news?" → Gemini calls
  # news_recent → mesh.invoke('news_feeds.recent') → reads top headlines.
  - from: raven
    to: news_feeds.recent

  # News keyword search. Shell edge is reserved for a future UI search
  # bar inside the News app (not consumed in the PR that introduces the
  # surface). Raven consumes immediately via the news_search voice tool
  # — "what's the latest on Iran" → FTS5 over the polled article pool.
  - from: shell
    to: news_feeds.search
  - from: raven
    to: news_feeds.search

  # News breaking — high-urgency-only shortcut. Shell edge is reserved
  # for a future "breaking" view inside the News app (the v0.3.6 UI
  # uses the Urgent chip to filter via news_feeds.recent with
  # urgency='high', so the breaking surface itself is not consumed
  # renderer-side in this PR). Raven consumes immediately via the
  # news_breaking voice tool — "what's breaking", "anything urgent".
  - from: shell
    to: news_feeds.breaking
  - from: raven
    to: news_feeds.breaking

  # News entity-aware search. Same multi-consumer-on-one-surface pattern
  # as recent / search / breaking. Shell edge is reserved for a future
  # "tap an entity chip" UI affordance (not consumed in the PR that
  # introduces the surface). Raven consumes immediately via the
  # news_search_by_entity voice tool — "what's the latest on Tim Cook"
  # → exact-match lookup over compromise-extracted persons / places /
  # organizations stored alongside the polled articles.
  - from: shell
    to: news_feeds.search_by_entity
  - from: raven
    to: news_feeds.search_by_entity

  # The Finance app (renderer-side) reads the cached ticker grid via the
  # market_summary surface, and the per-symbol quote surface backs any
  # future single-symbol click-through. The history surface backs the
  # in-card sparkline (last 24h per QuoteCard).
  - from: shell
    to: finance.market_summary
  - from: shell
    to: finance.quote
  - from: shell
    to: finance.history

  # Voice tools: finance_market_summary ("how's the market today") +
  # finance_quote ("what's AAPL at") + finance_history ("AAPL last
  # week"). All route through mesh.invoke.
  - from: raven
    to: finance.market_summary
  - from: raven
    to: finance.quote
  - from: raven
    to: finance.history

  # Sprint 2 finance extensions: movers, sectors, earnings, market_overview.
  # Shell edges reserved for future Finance app UI enhancements. Raven
  # consumes immediately via voice tools.
  - from: shell
    to: finance.movers
  - from: shell
    to: finance.sectors
  - from: shell
    to: finance.earnings
  - from: shell
    to: finance.market_overview
  - from: raven
    to: finance.movers
  - from: raven
    to: finance.sectors
  - from: raven
    to: finance.earnings
  - from: raven
    to: finance.market_overview

  # Voice tools: weather_current ("what's the weather") +
  # weather_forecast ("what's the forecast", "tomorrow's weather"). Both
  # route through mesh.invoke.
  - from: raven
    to: weather.current
  - from: raven
    to: weather.forecast

  # Digest is the first composer node — fans out across news + finance
  # + weather to synthesize briefings. Its outbound edges declare which
  # upstream surfaces it can read. Morning briefings source from
  # `news_feeds.breaking` (urgency-filtered: what changed overnight
  # that matters); evening briefings source from `news_feeds.recent`
  # (chronological day's wrap-up). The composer auto-selects per
  # surface; both edges live here. finance edges back the market /
  # history sections. weather.current backs the weather section.
  # host_notifications.notify backs the opt-in scheduled-delivery path
  # (DIGEST_SCHEDULED=true).
  - from: digest
    to: news_feeds.breaking
  - from: digest
    to: news_feeds.recent
  - from: digest
    to: finance.market_summary
  - from: digest
    to: finance.history
  - from: digest
    to: weather.current
  - from: digest
    to: weather.forecast
  - from: digest
    to: host_notifications.notify

  # Shell + raven consume the briefings. No renderer-side Digest app
  # in this PR — the shell edges are reserved for a future Digest UI;
  # raven consumes immediately via the digest_briefing voice tool
  # ("give me a morning briefing").
  - from: shell
    to: digest.morning
  - from: shell
    to: digest.evening
  - from: raven
    to: digest.morning
  - from: raven
    to: digest.evening

  # Vision capture: raven reads camera frames via vision.frame(). First
  # consumer is piece 2 (gesture detection): raven calls vision.frame()
  # in a loop during gesture-mode, passes frames to MediaPipe, and
  # interprets hand gestures as voice-session controls. Shell edge is
  # reserved for future renderer-side visual features (e.g. a camera
  # preview widget, visual context debugging).
  - from: raven
    to: vision.frame

  # Calendar events: raven reads macOS Calendar.app via EventKit. Three
  # voice tools: calendar_today ("what's on my calendar today"),
  # calendar_next ("what's my next event"), calendar_upcoming ("next
  # five things on my calendar"). All route through mesh.invoke. No
  # shell edges in this PR — reserved for a future Calendar app UI.
  - from: raven
    to: calendar.today
  - from: raven
    to: calendar.upcoming
  - from: raven
    to: calendar.next_event

  # Voice consumes reminders
  - from: raven
    to: reminders.due_today
  - from: raven
    to: reminders.overdue
  - from: raven
    to: reminders.upcoming
  # Voice consumes system_info
  - from: raven
    to: system_info.battery
  - from: raven
    to: system_info.disk
  - from: raven
    to: system_info.network
  - from: raven
    to: system_info.active_app
