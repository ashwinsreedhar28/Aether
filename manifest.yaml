# Aether mesh manifest.
#
# Loaded by `python3 -m core.core --manifest manifest.yaml` (run from the
# vendored `core/` directory by the shell's coreManager). Format and
# semantics are defined in `_ingest/RAVEN_MESH/docs/SPEC.md` §8.
#
# Authorization is graph-membership: an edge present below means the
# relationship is permitted; absent means denied. There is no policy field.
# To grant a new capability, add a relationship line.
#
# Identity secrets are NEVER literal in this file — they reference env vars
# that the shell populates at boot. See core/README.md for the env-var
# contract. Manifest validator warns (not errors) on unset env vars; Core
# autogenerates a fallback secret in that case, which is fine for tests but
# not what we want in dev.

nodes:
  - id: shell
    runtime: local-process
    category: Mixer
    identity_secret: env:MESH_SHELL_SECRET
    metadata:
      description: |
        Aether Electron main process. Acts as a mesh client only — the shell
        does not yet expose any inbound surfaces. Surfaces will be added as
        renderer-facing capabilities (e.g. shell.toast, shell.focus_app)
        become useful for other nodes to invoke.
    surfaces: []

  - id: host_notifications
    runtime: local-process
    category: Actor
    identity_secret: env:MESH_HOST_NOTIFICATIONS_SECRET
    metadata:
      description: |
        macOS native notification node. Fires `osascript -e 'display
        notification ...'` per invocation. macOS only in v0.1.0 — calls
        from any platform other than darwin return a MeshDeny.
    surfaces:
      - name: notify
        type: tool
        invocation_mode: request_response
        schema: nodes/host_notifications/schemas/notify.json

  - id: raven
    runtime: local-process
    category: Mixer
    identity_secret: env:MESH_RAVEN_SECRET
    metadata:
      description: |
        Voice assistant daemon (Gemini Live). Outbound-only mesh
        client — registers with Core so its signed envelopes are
        recognised but exposes no inbound surfaces. Voice tools route
        capability calls (e.g. notify) through mesh.invoke, not
        raven's internal tool registry.
    surfaces: []

  - id: news_feeds
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_NEWS_FEEDS_SECRET
    metadata:
      description: |
        RSS/Atom news aggregator. Polls a hardcoded feed list every
        15 minutes, dedupes by stable id, exposes recent articles
        ordered by published_at desc. Local SQLite. First real *data*
        node on the Aether mesh (host_notifications was the first
        action node).
    surfaces:
      - name: recent
        type: tool
        invocation_mode: request_response
        schema: nodes/news_feeds/schemas/recent.json
      - name: search
        type: tool
        invocation_mode: request_response
        schema: nodes/news_feeds/schemas/search.json
      - name: breaking
        type: tool
        invocation_mode: request_response
        schema: nodes/news_feeds/schemas/breaking.json
      - name: search_by_entity
        type: tool
        invocation_mode: request_response
        schema: nodes/news_feeds/schemas/search_by_entity.json

  - id: clipboard_history
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_CLIPBOARD_HISTORY_SECRET
    metadata:
      description: |
        macOS clipboard history. Polls pbpaste every 500ms, dedupes
        by SHA-256 content hash (ring buffer + SQLite UNIQUE), retains
        the most recent 1000 entries. Local SQLite. text/plain only
        for this lane; PNG / RTF / file refs deferred.
    surfaces:
      - name: recent
        type: tool
        invocation_mode: request_response
        schema: nodes/clipboard_history/schemas/recent.json

  - id: macos_messages
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_MACOS_MESSAGES_SECRET
    metadata:
      description: |
        macOS iMessage/SMS mirror. Reads ~/Library/Messages/chat.db
        read-only every 30s (better-sqlite3 readonly, 5s busy_timeout)
        with per-chat watermark dedup. Local SQLite. Requires Full
        Disk Access; on EACCES logs once and returns empty — the
        daemon stays up.
    surfaces:
      - name: recent
        type: tool
        invocation_mode: request_response
        schema: nodes/macos_messages/schemas/recent.json

  - id: macos_mail
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_MACOS_MAIL_SECRET
    metadata:
      description: |
        macOS Mail.app inbox mirror + opener. Bulk-reads recent headers
        every 60s and backfills plain-text bodies for the newest few into
        per-node SQLite. The open_message surface pulls a message up in
        Mail.app via the message:// URL scheme (LaunchServices, not
        AppleScript).
    surfaces:
      - name: recent
        type: tool
        invocation_mode: request_response
        schema: nodes/macos_mail/schemas/recent.json
      - name: open_message
        type: tool
        invocation_mode: request_response
        schema: nodes/macos_mail/schemas/open_message.json

  - id: finance
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_FINANCE_SECRET
    metadata:
      description: |
        Stock-quote aggregator. Polls Yahoo Finance every 5 minutes
        for a hardcoded US ticker list, Stooq CSV fallback, no API
        key. Current quotes cached in-memory; a separate 90-day SQLite
        series backs `history`. Seven surfaces: quotes, movers,
        sectors, earnings, market overviews.
    surfaces:
      - name: quote
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/quote.json
      - name: market_summary
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/market_summary.json
      - name: history
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/history.json
      - name: movers
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/movers.json
      - name: sectors
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/sectors.json
      - name: earnings
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/earnings.json
      - name: market_overview
        type: tool
        invocation_mode: request_response
        schema: nodes/finance/schemas/market_overview.json

  - id: weather
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_WEATHER_SECRET
    metadata:
      description: |
        Weather node. Polls Open-Meteo every 15 minutes for current
        conditions and a 7-day forecast. No API key (public tier).
        Requires AETHER_WEATHER_LAT/LON/LABEL; without them, starts
        in graceful-degradation mode (available: false). In-memory
        cache only.
    surfaces:
      - name: current
        type: tool
        invocation_mode: request_response
        schema: nodes/weather/schemas/current.json
      - name: forecast
        type: tool
        invocation_mode: request_response
        schema: nodes/weather/schemas/forecast.json

  - id: digest
    runtime: local-process
    category: Mixer
    identity_secret: env:MESH_DIGEST_SECRET
    metadata:
      description: |
        Briefing composer. First multi-hop mesh node: fans out to
        news_feeds + finance + weather and synthesizes a morning() or
        evening() briefing. Upstream failures degrade gracefully — the
        briefing never fails as a whole. Optional opt-in scheduler
        (DIGEST_SCHEDULED, default off).
    surfaces:
      - name: morning
        type: tool
        invocation_mode: request_response
        schema: nodes/digest/schemas/morning.json
      - name: evening
        type: tool
        invocation_mode: request_response
        schema: nodes/digest/schemas/evening.json

  - id: vision
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_VISION_SECRET
    metadata:
      description: |
        Vision capture node. Real-time camera frame access via
        AVFoundation. Piece 1 of the vision arc (MASTER_SYNTHESIS.md
        §11.6): 10fps capture with a 5s idle timeout for battery.
        Future pieces add vision.gestures() (MediaPipe) and
        vision.pointing_target(). macOS only in v0.1.x.
    surfaces:
      - name: frame
        type: tool
        invocation_mode: request_response
        schema: nodes/vision/schema/frame_response.json

  - id: calendar
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_CALENDAR_SECRET
    metadata:
      description: |
        macOS Calendar.app integration via EventKit. Reads events
        from all calendars visible to the app. First invocation
        prompts for access; if denied, surfaces return {available:
        false, reason: 'permission_denied'}. Four surfaces: today,
        upcoming (default 5, max 20), next_event, get_week (the
        7-day window from a given date; date omitted = next 7 days).
    surfaces:
      - name: today
        type: tool
        invocation_mode: request_response
        schema: nodes/calendar/schemas/today.json
      - name: upcoming
        type: tool
        invocation_mode: request_response
        schema: nodes/calendar/schemas/upcoming.json
      - name: next_event
        type: tool
        invocation_mode: request_response
        schema: nodes/calendar/schemas/next_event.json
      - name: get_week
        type: tool
        invocation_mode: request_response
        schema: nodes/calendar/schemas/get_week.json

  - id: reminders
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_REMINDERS_SECRET
    metadata:
      description: |
        macOS Reminders.app mesh node. Reads via pyobjc + EventKit.
        Three surfaces: reminders.due_today, .overdue, .upcoming.
        Read-only in v1. Permission prompt fires on first daemon
        spawn; the daemon stays alive returning permission_denied
        until the user grants access.
    surfaces:
      - name: due_today
        type: tool
        invocation_mode: request_response
        schema: nodes/reminders/schemas/due_today.json
      - name: overdue
        type: tool
        invocation_mode: request_response
        schema: nodes/reminders/schemas/overdue.json
      - name: upcoming
        type: tool
        invocation_mode: request_response
        schema: nodes/reminders/schemas/upcoming.json
  - id: system_info
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_SYSTEM_INFO_SECRET
    metadata:
      description: |
        macOS system context node. Surfaces battery state, disk
        usage, network/WiFi status, and active application via native
        shell commands (pmset, df, networksetup, osascript). No API
        keys, no OAuth. Readings cached 5-15s in-memory. TypeScript
        node spawned by nodeManager.
    surfaces:
      - name: battery
        type: tool
        invocation_mode: request_response
        schema: nodes/system_info/schemas/battery.json
      - name: disk
        type: tool
        invocation_mode: request_response
        schema: nodes/system_info/schemas/disk.json
      - name: network
        type: tool
        invocation_mode: request_response
        schema: nodes/system_info/schemas/network.json
      - name: active_app
        type: tool
        invocation_mode: request_response
        schema: nodes/system_info/schemas/active_app.json
      - name: processes
        type: tool
        invocation_mode: request_response
        schema: nodes/system_info/schemas/processes.json

  - id: time
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_TIME_SECRET
    metadata:
      description: |
        Stateless timezone-aware clock. One surface (time.now) returns
        the current wall-clock time in a requested IANA timezone via
        Intl.DateTimeFormat. No SQLite, poller, or cache — Date.now()
        per invocation. Invalid zones return MeshDeny('time_bad_zone').
    surfaces:
      - name: now
        type: tool
        invocation_mode: request_response
        schema: nodes/time/schemas/now.json

  - id: mesh_introspection
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_MESH_INTROSPECTION_SECRET
    metadata:
      description: |
        Mesh introspection sensor. Polls the broker's token-gated
        /__introspection__ endpoint every 2s and re-exposes live mesh
        topology + recent invocation activity as signed surfaces —
        admin telemetry any authorized consumer can read. Cache-then-
        serve, `stale` past 10s.
    surfaces:
      - name: topology
        type: tool
        invocation_mode: request_response
        schema: nodes/mesh_introspection/schemas/topology.json
      - name: activity
        type: tool
        invocation_mode: request_response
        schema: nodes/mesh_introspection/schemas/activity.json

  - id: visualizer
    runtime: local-process
    category: Mixer
    identity_secret: env:MESH_VISUALIZER_SECRET
    metadata:
      description: |
        Mixer bridging mesh state to the local RAVEN_AVP scene server
        — the only mesh component aware of both layers. One render
        surface, intent-routed: 'dashboard' seeds + refreshes the
        dashboard.* backdrop (~5s), 'mesh' summons a topology overlay,
        'lanes' the dev-lane panel, 'gaps' the capability-gap log, and
        'agenda' the today/tomorrow calendar overlay (reads
        calendar.today + calendar.upcoming). Script-free markdown
        panels in v1.
    surfaces:
      - name: render
        type: tool
        invocation_mode: request_response
        schema: nodes/visualizer/schemas/render.json

  - id: lanes
    runtime: local-process
    category: Sensor
    identity_secret: env:MESH_LANES_SECRET
    metadata:
      description: |
        Lanes sensor. Polls `git worktree list` every 10s and exposes
        which dev lanes (worktrees) are active vs idle via lanes.status.
        Activity is a file-mtime heuristic (NOT live process detection).
        Cache-then-serve, `stale` past 30s; notifies host_notifications
        on active→idle.
    surfaces:
      - name: status
        type: tool
        invocation_mode: request_response
        schema: nodes/lanes/schemas/status.json

  - id: github
    runtime: local-process
    category: Actor
    identity_secret: env:MESH_GITHUB_SECRET
    metadata:
      description: |
        GitHub Actor (the one-rail arc, #255/#256): gaps file as GitHub
        issues on the configured repo (env AETHER_GITHUB_REPO; auth via
        AETHER_GITHUB_TOKEN — fine-grained PAT, Issues RW, never logged).
        create_issue dedups INSIDE the surface: a repeat ask (matching
        normalized capability key) comments the existing gap issue and
        returns { deduped: true } instead of filing a duplicate.
        list_issues serves the open board cache-then-serve (30s TTL,
        `stale` on last-good-fetch fallback). get_issue reads ONE issue
        in full (body + first comment page, uncached) — the spec-guard
        read behind work_on_issue (#268). Token absent = degraded:
        list_issues serves a clean no-token payload, writes deny with
        github_no_token, nothing crashes. No close_issue surface by
        ruling — gaps close through the merge rail ('Closes #n').
        Supersedes the intents gap ledger (retired in Lane C, #258).
    surfaces:
      - name: create_issue
        type: tool
        invocation_mode: request_response
        schema: nodes/github/schemas/create_issue.json
      - name: list_issues
        type: tool
        invocation_mode: request_response
        schema: nodes/github/schemas/list_issues.json
      - name: comment_issue
        type: tool
        invocation_mode: request_response
        schema: nodes/github/schemas/comment_issue.json
      - name: get_issue
        type: tool
        invocation_mode: request_response
        schema: nodes/github/schemas/get_issue.json

  - id: music
    runtime: local-process
    category: Actor
    identity_secret: env:MESH_MUSIC_SECRET
    metadata:
      description: |
        Spotify playback Actor (#332): play/pause/skip/queue/search drive
        the active Spotify Connect device; now_playing polls at 3s only
        while playback is recent. PKCE auth — SPOTIFY_CLIENT_ID only, no
        client secret, refresh token cached owner-only. Denies loudly by
        name.
    surfaces:
      - name: play
        type: tool
        invocation_mode: request_response
        schema: nodes/music/schemas/play.json
      - name: pause
        type: tool
        invocation_mode: request_response
        schema: nodes/music/schemas/pause.json
      - name: skip
        type: tool
        invocation_mode: request_response
        schema: nodes/music/schemas/skip.json
      - name: queue
        type: tool
        invocation_mode: request_response
        schema: nodes/music/schemas/queue.json
      - name: search
        type: tool
        invocation_mode: request_response
        schema: nodes/music/schemas/search.json
      - name: now_playing
        type: tool
        invocation_mode: request_response
        schema: nodes/music/schemas/now_playing.json

  - id: viewer_desktop
    runtime: local-process
    category: Actor
    identity_secret: env:MESH_VIEWER_DESKTOP_SECRET
    metadata:
      description: |
        The agent->renderer control node, hosted inside the shell main
        process. Translates mesh invocations into renderer control actions
        (executeViewerControl -> window.__viewerControl) so an agent — raven,
        the self-build loop, another node — can open/close/focus apps and
        content views in the Viewer surface. Outbound view_event (human
        interaction) flows back to the opening agent via fire-and-forget.
    surfaces:
      - name: open_app
        type: tool
        invocation_mode: request_response
        schema: nodes/viewer_desktop/schemas/open_app.json
      - name: list_apps
        type: tool
        invocation_mode: request_response
        schema: nodes/viewer_desktop/schemas/list_apps.json
      - name: open_view
        type: tool
        invocation_mode: request_response
        schema: nodes/viewer_desktop/schemas/open_view.json
      - name: list_views
        type: tool
        invocation_mode: request_response
        schema: nodes/viewer_desktop/schemas/list_views.json
      - name: list_windows
        type: tool
        invocation_mode: request_response
        schema: nodes/viewer_desktop/schemas/list_windows.json
      - name: focus_window
        type: tool
        invocation_mode: request_response
        schema: nodes/viewer_desktop/schemas/focus_window.json
      - name: close_window
        type: tool
        invocation_mode: request_response
        schema: nodes/viewer_desktop/schemas/close_window.json
      - name: apply_layout
        type: tool
        invocation_mode: request_response
        schema: nodes/viewer_desktop/schemas/apply_layout.json
      - name: notify
        type: tool
        invocation_mode: request_response
        schema: nodes/viewer_desktop/schemas/notify.json
      - name: show_lane_card
        type: tool
        invocation_mode: request_response
        schema: nodes/viewer_desktop/schemas/show_lane_card.json


relationships:
  # The shell's renderer can fire native notifications via mesh.invoke().
  - from: shell
    to: host_notifications.notify

  # viewer_desktop control node — agent->renderer dispatch. raven (voice/console)
  # drives the full surface so it can open/close/focus apps + views by command.
  - from: raven
    to: viewer_desktop.open_app
  - from: raven
    to: viewer_desktop.list_apps
  - from: raven
    to: viewer_desktop.open_view
  - from: raven
    to: viewer_desktop.list_views
  - from: raven
    to: viewer_desktop.list_windows
  - from: raven
    to: viewer_desktop.focus_window
  - from: raven
    to: viewer_desktop.close_window
  - from: raven
    to: viewer_desktop.apply_layout
  - from: raven
    to: viewer_desktop.notify
  # Spawn-card summon (#305): "show me lane 219's card" → raven's
  # show_lane_card tool → this surface → the renderer raises that record's
  # SpawnApproval card. Its own edge per the every-consumer/surface-pair
  # law (#136).
  - from: raven
    to: viewer_desktop.show_lane_card
  # The shell itself (renderer apps / a headless round-trip) can open apps too.
  - from: shell
    to: viewer_desktop.open_app
  - from: shell
    to: viewer_desktop.list_apps

  # Voice tools dispatch desktop notifications via the host_notifications
  # node. Added when raven was rebased onto the mesh (v0.2.1).
  - from: raven
    to: host_notifications.notify

  # The News app (renderer-side) reads recent headlines through the mesh.
  # No more hardcoded articles list in shell/src/apps/news/.
  - from: shell
    to: news_feeds.recent

  # Voice tool news_recent: "what's in the news?" → Gemini calls
  # news_recent → mesh.invoke('news_feeds.recent') → reads top headlines.
  - from: raven
    to: news_feeds.recent

  # Voice tool clipboard_recent: "what's on my clipboard" / "what did I
  # copy" → Gemini calls clipboard_recent → mesh.invoke('clipboard_history.recent')
  # → reads the most recent pasteboard entries.
  - from: raven
    to: clipboard_history.recent

  # Voice tool messages_recent: "what did <person> say" / "any new
  # messages" → Gemini calls messages_recent → mesh.invoke('macos_messages.recent')
  # → reads recent iMessage/SMS rows mirrored from chat.db.
  - from: raven
    to: macos_messages.recent

  # Voice tool mail_recent: "any new mail" / "what's in my inbox" →
  # Gemini calls mail_recent → mesh.invoke('macos_mail.recent') → reads
  # recent Mail.app inbox messages mirrored via the AppleScript bridge.
  - from: raven
    to: macos_mail.recent

  - from: raven
    to: macos_mail.open_message

  # News keyword search. Shell edge is reserved for a future UI search
  # bar inside the News app (not consumed in the PR that introduces the
  # surface). Raven consumes immediately via the news_search voice tool
  # — "what's the latest on Iran" → FTS5 over the polled article pool.
  - from: shell
    to: news_feeds.search
  - from: raven
    to: news_feeds.search

  # News breaking — high-urgency-only shortcut. Shell edge is reserved
  # for a future "breaking" view inside the News app (the v0.3.6 UI
  # uses the Urgent chip to filter via news_feeds.recent with
  # urgency='high', so the breaking surface itself is not consumed
  # renderer-side in this PR). Raven consumes immediately via the
  # news_breaking voice tool — "what's breaking", "anything urgent".
  - from: shell
    to: news_feeds.breaking
  - from: raven
    to: news_feeds.breaking

  # News entity-aware search. Same multi-consumer-on-one-surface pattern
  # as recent / search / breaking. Shell edge is reserved for a future
  # "tap an entity chip" UI affordance (not consumed in the PR that
  # introduces the surface). Raven consumes immediately via the
  # news_search_by_entity voice tool — "what's the latest on Tim Cook"
  # → exact-match lookup over compromise-extracted persons / places /
  # organizations stored alongside the polled articles.
  - from: shell
    to: news_feeds.search_by_entity
  - from: raven
    to: news_feeds.search_by_entity

  # The Finance app (renderer-side) reads the cached ticker grid via the
  # market_summary surface, and the per-symbol quote surface backs any
  # future single-symbol click-through. The history surface backs the
  # in-card sparkline (last 24h per QuoteCard).
  - from: shell
    to: finance.market_summary
  - from: shell
    to: finance.quote
  - from: shell
    to: finance.history

  # Voice tools: finance_market_summary ("how's the market today") +
  # finance_quote ("what's AAPL at") + finance_history ("AAPL last
  # week"). All route through mesh.invoke.
  - from: raven
    to: finance.market_summary
  - from: raven
    to: finance.quote
  - from: raven
    to: finance.history

  # Sprint 2 finance extensions: movers, sectors, earnings, market_overview.
  # Shell edges reserved for future Finance app UI enhancements. Raven
  # consumes immediately via voice tools.
  - from: shell
    to: finance.movers
  - from: shell
    to: finance.sectors
  - from: shell
    to: finance.earnings
  - from: shell
    to: finance.market_overview
  - from: raven
    to: finance.movers
  - from: raven
    to: finance.sectors
  - from: raven
    to: finance.earnings
  - from: raven
    to: finance.market_overview

  # Voice tools: weather_current ("what's the weather") +
  # weather_forecast ("what's the forecast", "tomorrow's weather"). Both
  # route through mesh.invoke.
  - from: raven
    to: weather.current
  - from: raven
    to: weather.forecast

  # Digest is the first composer node — fans out across news + finance
  # + weather to synthesize briefings. Its outbound edges declare which
  # upstream surfaces it can read. Morning briefings source from
  # `news_feeds.breaking` (urgency-filtered: what changed overnight
  # that matters); evening briefings source from `news_feeds.recent`
  # (chronological day's wrap-up). The composer auto-selects per
  # surface; both edges live here. finance edges back the market /
  # history sections. weather.current backs the weather section.
  # host_notifications.notify backs the opt-in scheduled-delivery path
  # (DIGEST_SCHEDULED=true).
  - from: digest
    to: news_feeds.breaking
  - from: digest
    to: news_feeds.recent
  - from: digest
    to: finance.market_summary
  - from: digest
    to: finance.history
  - from: digest
    to: weather.current
  - from: digest
    to: weather.forecast
  - from: digest
    to: host_notifications.notify

  # Shell + raven consume the briefings. No renderer-side Digest app
  # in this PR — the shell edges are reserved for a future Digest UI;
  # raven consumes immediately via the digest_briefing voice tool
  # ("give me a morning briefing").
  - from: shell
    to: digest.morning
  - from: shell
    to: digest.evening
  - from: raven
    to: digest.morning
  - from: raven
    to: digest.evening

  # Vision capture: raven reads camera frames via vision.frame(). First
  # consumer is piece 2 (gesture detection): raven calls vision.frame()
  # in a loop during gesture-mode, passes frames to MediaPipe, and
  # interprets hand gestures as voice-session controls. Shell edge is
  # reserved for future renderer-side visual features (e.g. a camera
  # preview widget, visual context debugging).
  - from: raven
    to: vision.frame

  # Calendar events: raven reads macOS Calendar.app via EventKit. Four
  # voice tools: calendar_today ("what's on my calendar today"),
  # calendar_next ("what's my next event"), calendar_upcoming ("next
  # five things on my calendar"), calendar_get_week ("what's on my
  # calendar next week" — the tool resolves this/next/last week to a
  # date the surface reads). All route through mesh.invoke. No shell
  # edges in this PR — reserved for a future Calendar app UI.
  - from: raven
    to: calendar.today
  - from: raven
    to: calendar.upcoming
  - from: raven
    to: calendar.next_event
  - from: raven
    to: calendar.get_week

  # Voice consumes reminders
  - from: raven
    to: reminders.due_today
  - from: raven
    to: reminders.overdue
  - from: raven
    to: reminders.upcoming
  # Voice consumes system_info
  - from: raven
    to: system_info.battery
  - from: raven
    to: system_info.disk
  - from: raven
    to: system_info.network
  - from: raven
    to: system_info.active_app

  # Voice tool system_processes: "what's hogging my CPU" / "what's
  # eating my memory" → Gemini calls system_processes →
  # mesh.invoke('system_info.processes') → reads the current snapshot
  # of running processes via macOS `ps -axo`.
  - from: raven
    to: system_info.processes

  # Voice tool time_now: "what time is it in Tokyo" → Gemini calls
  # time_now → mesh.invoke('time.now', { zone: 'Asia/Tokyo' }). The
  # existing local-only voice tool is NOT migrated in this lane; that's
  # a follow-up.
  - from: raven
    to: time.now

  # Mesh introspection: the renderer-side mesh-viz content app (Issue
  # #108) reads live topology + recent invocation activity through the
  # mesh, NOT by hitting /__introspection__ directly — that endpoint
  # is admin-bearer-gated and not part of the mesh protocol. Edges
  # from shell because the viz app runs in the renderer that the shell
  # owns; mirrors the consume-surface pattern raven uses for other
  # data nodes.
  - from: shell
    to: mesh_introspection.topology
  - from: shell
    to: mesh_introspection.activity

  # Visualizer (Sprint 6.4): the Mixer reads mesh topology through the
  # mesh — same consume-surface pattern as the shell above — and composes
  # it into scene panels. This is the only outbound mesh edge it needs
  # (its other half, the scene-server POST, is plain HTTP, not a mesh hop).
  - from: visualizer
    to: mesh_introspection.topology
  # CLI/shell intent source: the shell invokes visualizer.render to summon a
  # visualization (e.g. "show me the mesh").
  - from: shell
    to: visualizer.render
  # RETIRED (Lane 3, ADR 2026-06-09 §5/§6 — Dashboard dropped for the Viewer
  # surface): the raven → visualizer.render edge that the Sprint 6.5 visualize
  # voice tool used. The tool (and its navigate sibling) is removed from
  # raven-core in the same lane; the shell-driven edge above is unchanged.

  # Lanes sensor (Sprint 6.5b): the visualizer reads lane activity through the
  # mesh and composes the dashboard.lanes backdrop + the viz-lanes overlay —
  # same consume-surface pattern as mesh_introspection.topology above.
  - from: visualizer
    to: lanes.status
  # The Lanes view (renderer-side) reads the same lane-activity snapshot
  # directly through the mesh — same consume-surface pattern as the shell
  # finance/mesh_introspection edges above.
  - from: shell
    to: lanes.status
  # The lanes sensor fires a host notification on an observed active→idle lane
  # transition ("Lane idle: <branch>"). A raven→lanes.status read edge (voice
  # "which lanes are working?") is a deferred follow-up micro-lane, not wired here.
  - from: lanes
    to: host_notifications.notify

  # GitHub Actor (one rail, #255/#256): raven files gaps through
  # github.create_issue — dedup lives INSIDE the surface (a repeat ask
  # comments the existing issue), so this single write edge is all the voice
  # path needs to file-or-bump. Lane C (#258) repoints report_gap here.
  - from: raven
    to: github.create_issue
  # raven adds detail to an existing gap issue by number ("add that to the
  # email gap") — a NEW relationship distinct from create; every
  # consumer/surface pair needs its own edge (#136's lesson).
  - from: raven
    to: github.comment_issue
  # The read edge (the "what can't you do yet" voice affordance, #255 ruling
  # 4): review_gaps pulls the open gap-labeled issues back for raven to
  # cluster into build proposals. A NEW relationship distinct from create /
  # comment — every consumer/surface pair needs its own edge (#136's lesson);
  # the shell pre-grant below does not cover raven.
  - from: raven
    to: github.list_issues
  # The single-issue read (work_on_issue's spec guard, #268): raven fetches
  # one issue in full — body + comments — to check for the ARCHITECT SPEC
  # marker and parse Branch:/Worktree: targets before arming a lane spawn.
  # A NEW relationship distinct from the board list (#136's lesson).
  - from: raven
    to: github.get_issue
  # The Gaps panel (renderer) reads the open issue board through the mesh —
  # mirrors the shell → lanes.status consume-surface pattern. Lane B (#257)
  # is pure renderer work on top of this edge.
  - from: shell
    to: github.list_issues
  # The spawn card's gate check (#310): a spawned lane's card reads the lane's
  # OWN issue thread — body + comments — to fold AT GATE / PR OPENED from the
  # fixed comment prefixes the kickoff dictates ("GATE REPORT — ",
  # "PR OPENED — "). Pull-based: one read on card open / explicit refresh, no
  # poller. A NEW relationship distinct from the board list above (#136's
  # lesson: every consumer/surface pair needs its own edge); raven's
  # get_issue edge does not cover the shell.
  - from: shell
    to: github.get_issue

  # Agenda overlay: the visualizer Mixer reads the calendar to compose the
  # summoned 'agenda' overlay (viz-agenda) — today's full day from calendar.today
  # plus the upcoming window it carves "tomorrow" from. Same consume-surface
  # pattern as its other read edges above; raven already has its own
  # raven → calendar.* edges (the voice path), and those do NOT cover the
  # visualizer (every consumer needs its own edge — #136's lesson).
  - from: visualizer
    to: calendar.today
  - from: visualizer
    to: calendar.upcoming

  # Music Actor (#332, Lane A of #225): raven drives the full playback
  # surface set by voice — the music_tool group itself lands in Lane B
  # (#225), but the edges are node registration and belong to this lane.
  # Every consumer/surface pair gets its own edge (#136's lesson).
  - from: raven
    to: music.play
  - from: raven
    to: music.pause
  - from: raven
    to: music.skip
  - from: raven
    to: music.queue
  - from: raven
    to: music.search
  # The standard Sensor read path for now_playing: raven for voice
  # ("what's playing?") in Lane B…
  - from: raven
    to: music.now_playing
  # …and the shell, which is both the #332 SMOKE's signed-envelope test
  # path (renderer devtools mesh.invoke routes as the shell node — the
  # gate smoke exercises play/pause/skip/now_playing through these) and
  # the read path Lane B's Viewer now-playing app will consume.
  - from: shell
    to: music.play
  - from: shell
    to: music.pause
  - from: shell
    to: music.skip
  - from: shell
    to: music.queue
  - from: shell
    to: music.search
  - from: shell
    to: music.now_playing
  # The now_playing poller emits a change event on an observed track change
  # ("Now playing: <track> — <artist>") on the house emission rail — the
  # same lanes → host_notifications.notify precedent.
  - from: music
    to: host_notifications.notify
