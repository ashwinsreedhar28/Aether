<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>homeOS</title>
    <style>
      /* Splash is static — Vite never sees it. Theme values are inlined
         to keep this file self-contained; they must match
         src/theme/holographic.css. */
      :root {
        --holo-bg: #0a0a0f;
        --holo-text: #e0e0e0;
        --holo-muted: #888888;
        --holo-accent: #4a9eff;
        --holo-border: rgba(100, 150, 255, 0.2);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        color: var(--holo-text);
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      .card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: rgba(10, 10, 15, 0.92);
        border: 1px solid var(--holo-border);
        border-radius: 18px;
        margin: 16px;
      }
      .dot {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          var(--holo-accent) 0%,
          rgba(100, 150, 255, 0.45) 45%,
          rgba(100, 150, 255, 0.08) 80%,
          transparent 100%
        );
        box-shadow: 0 0 28px rgba(100, 150, 255, 0.35);
      }
      .title {
        font-size: 28px;
        font-weight: 300;
        letter-spacing: 0.06em;
        color: var(--holo-accent);
      }
      .tagline {
        font-size: 12px;
        color: var(--holo-muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot"></div>
      <div class="title">homeOS</div>
      <div class="tagline">booting…</div>
    </div>
  </body>
</html>
