<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aether</title>
    <style>
      /* Splash is static — Vite never sees it. Theme values are inlined
         to keep this file self-contained; they must match
         src/theme/holographic.css. */
      :root {
        --holo-bg: #0a0a0f;
        --holo-text: #e0e0e0;
        --holo-muted: #888888;
        --holo-accent: #4a9eff;
        --holo-border: rgba(100, 150, 255, 0.2);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        color: var(--holo-text);
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      .card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--holo-bg);
        border: 1px solid var(--holo-border);
        border-radius: 18px;
        margin: 16px;
        overflow: hidden;
        z-index: 0;
      }
      /* Ambient star field across the whole card, echoing the icon's
         outer-field dots. Negative z-index paints it above the card
         background but below the logo/loader. */
      .starfield {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }
      /* Tile fill matches the card background (both --holo-bg), so only
         the constellation reads — the logo floats on the card. */
      .logo {
        width: 112px;
        height: 112px;
      }
      .status {
        font-size: 12px;
        color: var(--holo-muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        min-height: 14px;
        transition: opacity 200ms;
      }
      .progress {
        width: 200px;
        height: 2px;
        background: rgba(100, 150, 255, 0.12);
        border-radius: 1px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: var(--holo-accent);
        width: 0%;
        transition: width 250ms ease-out;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Card-wide ambient stars: same radii/opacity language as the
           icon's outer field, hand-scattered, sparse near the center so
           the logo and loader stay the focus. viewBox matches the card
           (440x320 window minus 16px margins). -->
      <svg class="starfield" viewBox="0 0 408 288" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="#FFFFFF">
          <circle cx="28" cy="36" r="1.6" opacity="0.4"/><circle cx="76" cy="22" r="1.2" opacity="0.3"/><circle cx="132" cy="58" r="1.8" opacity="0.45"/><circle cx="190" cy="18" r="1.3" opacity="0.3"/><circle cx="262" cy="30" r="1.5" opacity="0.35"/><circle cx="330" cy="48" r="2.0" opacity="0.5"/><circle cx="388" cy="24" r="1.4" opacity="0.3"/>
          <circle cx="398" cy="86" r="1.6" opacity="0.4"/><circle cx="372" cy="150" r="1.2" opacity="0.3"/><circle cx="392" cy="212" r="1.8" opacity="0.4"/><circle cx="310" cy="120" r="1.3" opacity="0.3"/>
          <circle cx="352" cy="262" r="1.4" opacity="0.35"/><circle cx="282" cy="272" r="1.9" opacity="0.45"/><circle cx="206" cy="260" r="1.2" opacity="0.3"/><circle cx="132" cy="268" r="1.7" opacity="0.4"/><circle cx="62" cy="250" r="1.3" opacity="0.3"/>
          <circle cx="20" cy="196" r="1.8" opacity="0.45"/><circle cx="36" cy="130" r="1.4" opacity="0.35"/><circle cx="16" cy="78" r="1.2" opacity="0.3"/><circle cx="104" cy="160" r="1.5" opacity="0.3"/>
        </g>
      </svg>
      <!-- Inline copy of assets/icon/aether-app-icon-v4.svg (splash is
           static and self-contained; keep in sync with the source SVG). -->
      <svg class="logo" width="112" height="112" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Aether app icon</title><desc>White star-field letter A constellation on a deep night-blue rounded tile.</desc>
<!-- Tile fill mirrors the shell Desktop background token "holo-bg" (CSS var in shell/src/index.css): #0a0a0f. Keep in sync. -->
<rect width="512" height="512" rx="115" fill="#0a0a0f"/>
<g fill="#FFFFFF"><circle cx="78" cy="70" r="1.8" opacity="0.45"/><circle cx="196" cy="52" r="1.3" opacity="0.3"/><circle cx="438" cy="84" r="2.1" opacity="0.5"/><circle cx="470" cy="178" r="1.4" opacity="0.35"/><circle cx="56" cy="200" r="1.5" opacity="0.35"/><circle cx="108" cy="448" r="1.4" opacity="0.3"/><circle cx="258" cy="470" r="1.8" opacity="0.4"/><circle cx="420" cy="448" r="2.0" opacity="0.45"/><circle cx="330" cy="56" r="1.5" opacity="0.35"/></g>
<g fill="#FFFFFF"><circle cx="78.1" cy="335.5" r="4.38"/><circle cx="71.9" cy="360.5" r="3.86"/><circle cx="90.7" cy="375.8" r="3.34"/><circle cx="115.8" cy="369.7" r="3.39"/><circle cx="136.4" cy="353.5" r="3.45"/><circle cx="153.9" cy="333.9" r="3.50"/><circle cx="169.7" cy="313.0" r="3.38"/><circle cx="185.1" cy="291.7" r="3.26"/><circle cx="200.3" cy="270.3" r="3.13"/><circle cx="215.3" cy="248.7" r="3.01"/><circle cx="230.3" cy="227.1" r="2.98"/><circle cx="245.3" cy="205.6" r="2.98"/><circle cx="260.4" cy="184.1" r="2.98"/><circle cx="275.7" cy="162.8" r="2.98"/><circle cx="291.5" cy="141.8" r="2.95"/><circle cx="330.6" cy="136.2" r="3.73"/><circle cx="325.8" cy="162.0" r="4.38"/><circle cx="318.9" cy="187.3" r="4.90"/><circle cx="311.3" cy="212.5" r="5.37"/><circle cx="303.2" cy="237.4" r="5.84"/><circle cx="294.7" cy="262.3" r="6.31"/><circle cx="285.9" cy="287.0" r="6.47"/><circle cx="276.7" cy="311.6" r="6.25"/><circle cx="267.3" cy="336.2" r="6.02"/><circle cx="257.6" cy="360.5" r="5.80"/><circle cx="248.8" cy="385.2" r="5.59"/><circle cx="257.1" cy="408.0" r="5.40"/><circle cx="282.5" cy="413.4" r="5.23"/><circle cx="308.6" cy="410.8" r="5.06"/><circle cx="334.0" cy="404.3" r="4.89"/><circle cx="358.6" cy="395.0" r="4.71"/><circle cx="382.2" cy="383.5" r="4.50"/><circle cx="404.4" cy="369.5" r="4.29"/><circle cx="424.6" cy="352.8" r="4.08"/><circle cx="438.7" cy="331.1" r="5.26"/><circle cx="157.1" cy="286.5" r="4.21"/><circle cx="192.7" cy="276.8" r="3.15"/><circle cx="229.1" cy="271.5" r="2.72"/><circle cx="265.9" cy="268.8" r="2.72"/><circle cx="307.8" cy="264.1" r="3.15"/><circle cx="338.5" cy="256.7" r="4.21"/><path d="M322.6 93.3 L326.2 104.6 L337.5 108.2 L326.2 111.9 L322.6 123.1 L318.9 111.9 L307.7 108.2 L318.9 104.6 Z"/></g>
</svg>
      <div class="status" id="status">Booting…</div>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
    </div>
    <script>
      // splashPreload.ts exposes window.aetherSplash.onPhase. Each phase
      // tick (start or ready) updates the status line and grows the bar by
      // index/total. The script no-ops if the bridge is missing (e.g. the
      // file is opened directly outside Electron during static checks).
      const statusEl = document.getElementById('status')
      const barEl = document.getElementById('bar')
      if (window.aetherSplash && statusEl && barEl) {
        window.aetherSplash.onPhase(({ label, index, total }) => {
          statusEl.textContent = label
          barEl.style.width = Math.round((index / total) * 100) + '%'
        })
      }
    </script>
  </body>
</html>
